name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: ["v0.11.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the released server
        run: python -m pip install zals==0.1.0
      - run: make check-all
